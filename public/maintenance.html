<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحت الصيانة | وجد الأصايل</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 100%;
            border: 1px solid #f1f5f9;
        }
        .icon-container {
            background-color: #eff6ff;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
        }
        .icon {
            font-size: 40px;
        }
        h1 {
            color: #0f172a;
            margin-bottom: 16px;
            font-size: 28px;
            font-weight: 700;
        }
        p {
            color: #64748b;
            line-height: 1.7;
            font-size: 18px;
            font-weight: 500;
        }
        .logo {
            width: 140px;
            margin-bottom: 30px;
        }
        .pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- الشعار الخاص بالموقع -->
        <img src="/assets/logo.png" alt="وجد الأصايل" class="logo" onerror="this.style.display='none'">
        
        <div class="icon-container pulse">
            <div class="icon">🛠️</div>
        </div>
        
        <h1>الموقع تحت الصيانة</h1>
        <p>نقوم حالياً ببعض التحديثات وأعمال الصيانة لتحسين تجربتكم.<br>سنعود للعمل في أقرب وقت ممكن. شكراً لتفهمكم وصبركم!</p>
    </div>
</body>
</html>
